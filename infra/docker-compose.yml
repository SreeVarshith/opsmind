# Local infrastructure for OpsMind.
#   docker compose -f infra/docker-compose.yml up -d
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1   # keep in step with qdrant-client in requirements.txt
    container_name: opsmind-qdrant
    ports:
      - "6333:6333"   # REST API + web dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
